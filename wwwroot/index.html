<body>
    <div id="app">
        <div class="boot-window" role="status" aria-live="polite">
            <div class="boot-text">Loading...</div>
            <div class="boot-blocks" aria-hidden="true">
                <span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span><span class="boot-block"></span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (function () {
            var blocks = document.querySelectorAll('.boot-block');
            var timer = setInterval(update, 150);

            function update() {
                var host = document.getElementById('app');
                if (!host || !host.querySelector('.boot-window')) {
                    clearInterval(timer);
                    return;
                }
                var raw = getComputedStyle(document.documentElement).getPropertyValue('--blazor-load-percentage');
                var pct = parseFloat(raw);
                if (isNaN(pct)) pct = 0;
                var count = Math.round(blocks.length * pct / 100);
                blocks.forEach(function (b, i) {
                    b.classList.toggle('on', i < count);
                });
            }

            update();
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/js-dos.js"></script>

</body>
